name: İndirim Radarı — Otomatik Tarama

on:
  schedule:
    # Her 2 saatte bir (UTC) otomatik çalışır
    - cron: "27 */2 * * *"
  workflow_dispatch:
    inputs:
      brand:
        description: "Taranacak marka(lar) veya grup: all, inditex, eren, mango, trendyol, shoes, clothing, independents, independent_clothing, independent_shoes veya virgülle ayrılmış liste"
        required: false
        default: "all"
        type: string
      target_mode:
        description: "Çalışma modu uyumluluk filtresi (cloud: veri merkezi uyumlu markalar, local: WAF korumalı yerel markalar, all: tümü)"
        required: false
        default: "cloud"
        type: choice
        options:
          - cloud
          - all
          - local
      section:
        description: "Taranacak reyon (auto: Ayarlar'daki target_genders tercihine göre otomatik)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - men
          - women
      max_categories:
        description: "Marka başına maksimum kategori sayısı"
        required: false
        default: "12"
        type: string
      skip_ai:
        description: "AI tarz puanlamasını atla (--skip-ai)"
        required: false
        default: false
        type: boolean
      no_notify:
        description: "Web Push bildirim gönderimini kapat (--no-notify)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Supabase'e yazmadan test çalıştır (--dry-run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: indirim-radari-scrape
  cancel-in-progress: false

jobs:
  plan:
    name: Tarama Gruplarını Hazırla
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
    steps:
      - name: Matrix hedeflerini belirle
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRAND: ${{ github.event.inputs.brand || 'all' }}
        run: |
          BRAND_CLEAN=$(echo "$INPUT_BRAND" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ "$EVENT_NAME" = "schedule" ] || [ -z "$BRAND_CLEAN" ] || [ "$BRAND_CLEAN" = "all" ]; then
            # 20 aktif cloud markasını çakışmasız 5 paralel gruba böl:
            # 1) inditex (5): zara, pullandbear, bershka, lefties, massimodutti
            # 2) eren (3): superstep, occasion, fashfed
            # 3) mango,trendyol (3 cloud): mangoman, trendyolmilla, trendyolman
            # 4) independent_clothing (4): hm, defacto, mavi, jackjones
            # 5) independent_shoes (5 cloud): instreet, sneaksup, barcin, sportive, pumaoutlet
            TARGETS='["inditex","eren","mango,trendyol","independent_clothing","independent_shoes"]'
          else
            TARGETS=$(jq -cn --arg b "$BRAND_CLEAN" '[$b]')
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "Seçilen paralel tarama hedefleri: $TARGETS"

  scrape:
    name: Tarama (${{ matrix.target }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Gerekli gizli anahtarları doğrula
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL ve SUPABASE_SERVICE_ROLE_KEY GitHub Secrets içinde tanımlı olmalıdır."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY tanımlı değil; AI tarz puanlaması güvenli biçimde atlanacak."
          fi
          if [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::warning::VAPID_PRIVATE_KEY tanımlı değil; Web Push bildirimleri atlanacak."
          fi

      - name: İndirim taramasını çalıştır (${{ matrix.target }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_SUB: ${{ secrets.VAPID_CLAIMS_SUB }}
          SCRAPER_RUN_MODE: cloud
          PYTHONUNBUFFERED: "1"
          MATRIX_TARGET: ${{ matrix.target }}
          INPUT_TARGET_MODE: ${{ github.event.inputs.target_mode || 'cloud' }}
          INPUT_SECTION: ${{ github.event.inputs.section || 'auto' }}
          INPUT_MAX_CATEGORIES: ${{ github.event.inputs.max_categories || '12' }}
          INPUT_SKIP_AI: ${{ github.event.inputs.skip_ai || 'false' }}
          INPUT_NO_NOTIFY: ${{ github.event.inputs.no_notify || 'false' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS=(
            "--brand" "$MATRIX_TARGET"
            "--target-mode" "$INPUT_TARGET_MODE"
            "--section" "$INPUT_SECTION"
            "--max-categories" "$INPUT_MAX_CATEGORIES"
            "--run-mode" "cloud"
          )

          if [ "$INPUT_SKIP_AI" = "true" ]; then
            ARGS+=("--skip-ai")
          fi
          if [ "$INPUT_NO_NOTIFY" = "true" ]; then
            ARGS+=("--no-notify")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=("--dry-run")
          fi

          python -m scraper.main "${ARGS[@]}"
